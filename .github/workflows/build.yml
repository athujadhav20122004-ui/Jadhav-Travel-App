
name: Build JADHAV TRAVEL'S APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Jadhav_Travels_Android_Studio_Project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir app-source
          unzip Jadhav_Travels_Android_Studio_Project.zip -d app-source

      - name: Build APK
        run: gradle -p app-source assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JADHAV-TRAVELS-APK
          path: app-source/app/build/outputs/apk/debug/app-debug.apk
          
